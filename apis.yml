name: Arbor Software
description: Arbor Software Corporation was an enterprise business-intelligence and OLAP software
  company founded in 1991 in Sunnyvale, California by Bob Earle and Jim Dorian. It created Essbase,
  the pioneering multidimensional online-analytical-processing (OLAP) server first released in 1992,
  and went public on NASDAQ under the ticker ARSW in 1995. Arbor merged with Hyperion Software in
  1998 to form Hyperion Solutions Corporation, which Oracle Corporation acquired in 2007; the Essbase
  technology lives on inside Oracle. Arbor Software no longer exists as an independent entity and
  publishes no live API, developer portal, or documentation surface, so there is nothing to enrich.
